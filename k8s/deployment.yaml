apiVersion: apps/v1
kind: Deployment
metadata:
  name: recyclenet-deployment
  labels:
    app: recyclenet
    component: api
    tier: backend
    runtime: python
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recyclenet
      component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: recyclenet
        component: api
        tier: backend
        runtime: python
    spec:
      # Pod-level security context enforcing non-root execution
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      # Soft anti-affinity to spread replicas across distinct nodes for High Availability
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - recyclenet
                topologyKey: kubernetes.io/hostname
      containers:
        - name: recyclenet-api
          image: recyclenet-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          # Bulk decouple environment variables from ConfigMap and Secret
          envFrom:
            - configMapRef:
                name: recyclenet-config
            - secretRef:
                name: recyclenet-secret
          # Granular environment variable overrides and key references
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: recyclenet-config
                  key: PORT
            - name: RECYCLENET_MODEL_PATH
              valueFrom:
                configMapKeyRef:
                  name: recyclenet-config
                  key: RECYCLENET_MODEL_PATH
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: recyclenet-config
                  key: LOG_LEVEL
            - name: RECYCLENET_API_KEY
              valueFrom:
                secretKeyRef:
                  name: recyclenet-secret
                  key: RECYCLENET_API_KEY
                  optional: true
          # Compute resource guarantees and bounds
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          # Liveness probe: verifies process liveness and detects deadlock conditions
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Readiness probe: verifies ONNX model weights are initialized and ready to serve traffic
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          # Container-level security hardening
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
