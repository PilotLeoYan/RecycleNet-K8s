apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: recyclenet-hpa
  labels:
    app: recyclenet
    component: autoscaler
    tier: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: recyclenet-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    # Scale-up behavior: Immediate burst absorption to prevent inference latency spikes
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
    # Scale-down behavior: Conservative cooldown window (60s) to avoid pod thrashing / flapping
    scaleDown:
      stabilizationWindowSeconds: 60
      selectPolicy: Min
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
