name: CI - Quality, Security & Tests

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel in-progress runs for previous commits on pull requests to save CI resources
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  pipeline:
    name: Lint, Security & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Check formatting (Ruff)
        run: uv run ruff format --check .

      - name: Lint code (Ruff)
        run: uv run ruff check .

      - name: Type check (Mypy)
        run: uv run mypy .

      - name: Run Bandit (Security Linter)
        run: uvx bandit -r src/ -c pyproject.toml

      - name: Audit dependencies (CVEs)
        run: uv audit

      - name: Run unit tests (Pytest)
        run: uv run pytest tests/ -v --durations=10
