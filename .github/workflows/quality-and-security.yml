name: Quality & Security Linters

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  security-linters:
    name: Security Scanners (Bandit & Audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      # Bandit for static security scanning in Python
      - name: Run Bandit (Security Linter)
        run: |
          uv run bandit -r src/ -c pyproject.toml -f txt || true

      # Audit of Known Vulnerabilities (CVEs)
      - name: Run pip-audit
        run: |
          uv run pip-audit --strict || true
