name: CI - Quality, Security & Tests

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel in-progress runs for previous commits on pull requests to save CI resources
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  pipeline:
    name: Lint, Security & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen --all-groups --extra cpu

      - name: Check formatting (Ruff)
        run: uv run ruff format --check src tests

      - name: Lint code (Ruff)
        run: uv run ruff check src tests

      - name: Static type check (Mypy)
        run: uv run mypy src tests

      - name: Security SAST scan (Bandit)
        run: uv run bandit -c pyproject.toml -r src

      - name: Validate Kubernetes manifests & HPA autoscaling
        run: uv run python -m src.k8s.orchestrator

      - name: Validate DevSecOps workflows & GCP cloud deployment
        run: uv run python -m src.devsecops.orchestrator

      - name: Run tests & coverage (Pytest)
        run: uv run pytest tests/ -v --cov=src --cov-fail-under=80 --durations=10
