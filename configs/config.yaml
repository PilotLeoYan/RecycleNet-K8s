ingestion:
  zip_source: "trashnet/dataset-original.zip"
  raw_output_dir: "data/raw"

transformation:
  image_size: [224, 224]
  image_mean: [0.485, 0.456, 0.406]
  image_std: [0.229, 0.224, 0.225]
  random_h_flip: 0.5
  random_rotation: [-90, 90]
  train_split: 0.7
  eval_split: 0.15
  test_split: 0.15
  batch_size: 32
  num_workers: 4
  pin_memory: True

reproducibility:
  random_seed: 42
  numpy_seed: 42
  torch_seed: 42

training:
  num_classes: 6
  epochs: 1
  patience: 3
  learning_rate: 0.001
  weight_decay: 0.0001
  device: "cuda"

tracking:
  experiment_name: "RecycleNet_Training"
  registered_model_name: "RecycleNet"
  tracking_uri: "sqlite:///mlflow.db"
