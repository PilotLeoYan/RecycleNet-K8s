[project]
name = "recyclenet-k8s"
version = "0.1.0"
description = ""
authors = [
    {name = "LeoYan",email = "leofabyano@gmail.com"}
]
requires-python = ">=3.11, <4.0.0"
dependencies = [
    "torch>=2.2.0,<3.0.0",
    "mlflow>=2.14.0,<4.0.0",
    "scikit-learn>=1.4.0,<2.0.0",
    "torchvision>=0.17.0,<1.0.0",
    "numpy>=1.26.0,<3.0.0",
    "matplotlib>=3.8.0,<4.0.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = [{ index = "pytorch-gpu" }]
torchvision = [{ index = "pytorch-gpu" }]

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.10.0",
    "pre-commit>=3.5.0",
    "pytest>=8.0.0",
    "types-pyyaml>=6.0.12",
    "bandit>=1.7.8",
    "pip-audit>=2.7.3",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"


[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
warn_unreachable = true
ignore_missing_imports = true
exclude = [
    "^data",
    "^trashnet",
]
explicit_package_bases = true

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
package = false

[tool.bandit]
# Folders to Exclude During Security Scans
exclude_dirs = [
    "tests",
    "data",
    "trashnet",
    "mlruns",
    "docs",
    ".venv"
]

# Rules to skip
skips = ["B101", "B311"]
