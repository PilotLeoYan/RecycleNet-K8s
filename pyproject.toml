[project]
name = "recyclenet-k8s"
version = "0.1.0"
description = ""
authors = [
    {name = "LeoYan",email = "leofabyano@gmail.com"}
]
requires-python = ">=3.14, <4.0.0"
dependencies = [
    "torch>=2.13.0,<3.0.0",
    "mlflow>=3.14.0,<4.0.0",
    "scikit-learn>=1.9.0,<2.0.0",
    "torchvision>=0.28.0,<0.29.0",
    "numpy>=2.5.2,<3.0.0",
    "matplotlib>=3.11.1,<4.0.0",
    "graphql-core>=3.2.0",
    "graphene>=3.0"
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = [{ index = "pytorch-gpu" }]
torchvision = [{ index = "pytorch-gpu" }]

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "ruff (>=0.15.21,<0.16.0)",
    "mypy (>=2.3.0,<3.0.0)",
    "pre-commit (>=4.6.0,<5.0.0)",
    "pytest (>=9.1.1,<10.0.0)"
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
warn_unreachable = true
ignore_missing_imports = true
exclude = [
    "^data",
    "^trashnet",
]
explicit_package_bases = true

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
package = false
