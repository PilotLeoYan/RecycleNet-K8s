[project]
name = "recyclenet-k8s"
version = "0.1.0"
description = ""
authors = [
    {name = "LeoYan",email = "leofabyano@gmail.com"}
]
requires-python = ">=3.14, <4.0.0"
dependencies = [
    "mlflow>=3.16.0,<4.0.0",
    "scikit-learn>=1.9.0,<2.0.0",
    "numpy>=2.5.2,<3.0.0",
    "matplotlib>=3.11.1,<4.0.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "ray[tune]>=2.58.0",
    "optuna>=5.0.0",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.0",
    "onnxscript>=0.7.2",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "python-multipart>=0.0.32",
    "pillow>=12.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
cpu = [
    "torch>=2.13.0,<3.0.0",
    "torchvision==0.29.1",
]
gpu = [
    "torch>=2.13.0,<3.0.0",
    "torchvision==0.29.1",
]

[tool.uv]
package = false
override-dependencies = [
    "cryptography>=50.0.0",
    "gitpython>=3.2.1",
    "graphql-core>=3.2.12",
    "opentelemetry-api>=1.45.1",
]
conflicts = [
    [
        {extra = "cpu"},
        {extra = "gpu"},
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-gpu", extra = "gpu" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-gpu", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "ruff>=0.15.21,<0.18.0",
    "mypy (>=2.3.0,<3.0.0)",
    "pre-commit (>=4.6.0,<5.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "types-pyyaml>=6.0.12.20260815",
    "ipykernel>=7.3.0",
    "bandit>=1.9.4",
    "python-lsp-server[all]>=1.15.0",
    "httpx>=0.27.0",
    "pytest-cov>=6.0.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
warn_unreachable = true
ignore_missing_imports = true
exclude = [
    "^data",
    "^trashnet",
]
explicit_package_bases = true

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.bandit]
# Folders to Exclude During Security Scans
exclude_dirs = [
    "tests",
    "data",
    "trashnet",
    "mlruns",
    "docs",
    ".venv"
]

# Rules to skip
skips = ["B101", "B311"]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/main.py",
    "src/__main__.py",
    "src/pipeline/ray_resources.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
precision = 2
