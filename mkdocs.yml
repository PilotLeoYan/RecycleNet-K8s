site_name: RecycleNet MLOps Docs
site_description: API documentation and reference for RecycleNet-K8s
site_author: LeoYan
repo_url: https://github.com/PilotLeoYan/RecycleNet-K8s
repo_name: RecycleNet-K8s

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant # Ultra-fast SPA-style charging
    - navigation.tabs # Top bar with tabs
    - navigation.sections # Hierarchical sections
    - navigation.top # Floating ‘Back to top’ button
    - search.suggest # Search engine suggestions
    - search.highlight # Highlight terms found
    - content.code.copy # Button for copying code snippets

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.] # project root to resolve src.* modules
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true # Displays a drop-down menu with the original source code
            show_category_heading: true
            merge_init_into_class: true # Displays the __init__ parameters in the class header

markdown_extensions:
  # Material for MkDocs renders ```mermaid fences as diagrams only when the
  # fence is converted to <pre class="mermaid"> by this custom fence handler.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Overview: index.md
  - Architecture & MLOps: architecture.md
  - Serving Architecture: serving_architecture.md
  - Kubernetes Orchestration: k8s_orchestration.md
  - DevSecOps & Cloud Deployment: devsecops_cicd.md
  - API Reference:
      - Components: reference/components.md
      - Pipelines: reference/pipeline.md
      - Utilities: reference/utils.md
